  <path d="M92 28 L164 28 L164 100 Q164 133 128 150 Q92 133 92 100 Z" stroke="white" stroke-width="2" fill="none"/>
  <!-- Shield center divider -->
  <line x1="128" y1="28" x2="128" y2="150" stroke="rgba(255,255,255,0.55)" stroke-width="1.5"/>

  <!-- Checklist  top right -->
  <!-- Item 1: filled circle with checkmark -->
  <circle cx="207" cy="50" r="10" fill="#3578C4"/>
  <path d="M202 50 L205.5 53.5 L213 44.5" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="222" y1="47" x2="260" y2="47" stroke="#9BBDD6" stroke-width="3" stroke-linecap="round"/>
  <line x1="222" y1="54" x2="248" y2="54" stroke="#9BBDD6" stroke-width="3" stroke-linecap="round"/>

  <!-- Item 2: open circle -->
  <circle cx="207" cy="76" r="10" fill="none" stroke="#9BBDD6" stroke-width="1.8"/>
  <circle cx="207" cy="76" r="3.5" fill="#9BBDD6"/>
  <line x1="222" y1="73" x2="260" y2="73" stroke="#9BBDD6" stroke-width="3" stroke-linecap="round"/>
  <line x1="222" y1="80" x2="248" y2="80" stroke="#9BBDD6" stroke-width="3" stroke-linecap="round"/>

  <!-- Checkbox items  bottom left -->
