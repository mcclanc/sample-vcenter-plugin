  <circle cx="40" cy="120" r="9.5" fill="none" stroke="#8BAFC6" stroke-width="1.8"/>
  <circle cx="40" cy="120" r="3" fill="#8BAFC6"/>
  <circle cx="59" cy="120" r="3" fill="#516878"/>

  <!-- Item 2: filled circle with checkmark -->
