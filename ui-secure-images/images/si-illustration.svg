  <path d="M35 145 L38.5 148.5 L46 140" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="59" cy="145" r="3" fill="#516878"/>

  <!-- Scattered dots -->
  <circle cx="83" cy="36" r="3.5" fill="#8BBACF"/>
  <circle cx="183" cy="153" r="3.5" fill="#8BBACF"/>
  <circle cx="167" cy="40" r="2.5" fill="#8BBACF"/>
</svg>
